[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nisaba"
version = "0.1.0"
description = "Resumable cold archive of a ChatGPT account. Session-cookie auth with auto-refresh (401/403), Chrome TLS impersonation for the exchange endpoint, source-faithful JSON + markdown + attachments + indexes."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Timur Shchukin", email = "timur@shchuk.in" },
]
keywords = ["chatgpt", "archive", "backup", "openai", "export", "cold-storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = [
    "curl_cffi>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Stimurid/nisaba"
Repository = "https://github.com/Stimurid/nisaba"
Issues = "https://github.com/Stimurid/nisaba/issues"

[project.scripts]
# `pip install nisaba` -> `nisaba --output <...>` works from any shell
nisaba = "nisaba.archiver:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["nisaba*"]

[tool.setuptools.package-data]
nisaba = ["py.typed"]
